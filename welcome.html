<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amana ERP - Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #01579b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .welcome-card {
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
        }
        .welcome-card h1 {
            color: #1a237e;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .welcome-card p {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }
        .btn-signup {
            background: #1a237e;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            margin: 10px;
            width: 180px;
        }
        .btn-signup:hover {
            background: #283593;
            color: white;
        }
        .btn-signin {
            background: white;
            color: #1a237e;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            border: 2px solid #1a237e;
            margin: 10px;
            width: 180px;
        }
        .btn-signin:hover {
            background: #f5f5f5;
            color: #1a237e;
        }
        .logo {
            font-size: 60px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <div class="logo">🏢</div>
        <h1>Amana ERP</h1>
        <p>Business Management System</p>
        
        <div style="margin-top: 30px;">
            <a href="/setup" class="btn btn-signup">Sign Up</a>
            <a href="/login" class="btn btn-signin">Sign In</a>
        </div>
        
        <div style="margin-top: 30px; display: flex; justify-content: space-between; gap: 20px;">
            <div style="flex: 1; text-align: center; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                <h6 style="color: #495057; margin-bottom: 10px;">🚀 New User?</h6>
                <p style="color: #6c757d; margin: 0; font-size: 14px;">
                    Click <strong>Sign Up</strong> to create your company and admin account
                </p>
            </div>
            <div style="flex: 1; text-align: center; padding: 15px; background: #e3f2fd; border-radius: 8px;">
                <h6 style="color: #084298; margin-bottom: 10px;">👤 Existing User?</h6>
                <p style="color: #6c757d; margin: 0; font-size: 14px;">
                    Click <strong>Sign In</strong> to access your existing account
                </p>
            </div>
        </div>
        
        <p style="margin-top: 20px; font-size: 12px; color: #999;">
            <i class="fas fa-shield-alt"></i> Your data is stored locally and securely
        </p>
    </div>
</body>
</html>
